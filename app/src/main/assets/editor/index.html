<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Docs</title>
<link rel="stylesheet" href="editor.css">
</head>
<body class="light">

<!-- ======================= TOP BAR ======================= -->
<header id="topbar">
  <button class="icon-btn" id="btnMenu" title="Menu" aria-label="Menu">
    <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
  </button>
  <div class="doc-meta">
    <input id="docTitle" class="doc-title" value="Untitled document" spellcheck="false" aria-label="Document title">
    <div class="menu-row" id="menuRow">
      <button class="menu-item" data-menu="file">File</button>
      <button class="menu-item" data-menu="edit">Edit</button>
      <button class="menu-item" data-menu="view">View</button>
      <button class="menu-item" data-menu="insert">Insert</button>
      <button class="menu-item" data-menu="format">Format</button>
    </div>
  </div>
  <div class="topbar-right">
    <span id="saveState" class="save-state">Saved</span>
    <button class="icon-btn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A7 7 0 0 1 12 3z"/></svg>
    </button>
    <button class="pill-btn" id="btnShare" title="Export / Share">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M14 9V5l7 7-7 7v-4H4V9z"/></svg>
      <span>Export</span>
    </button>
  </div>
</header>

<!-- ======================= TOOLBAR RIBBON ======================= -->
<div id="ribbon">
  <div class="ribbon-scroll" id="ribbonScroll">

    <!-- undo / redo / print -->
    <div class="tb-group">
      <button class="tb" id="tbUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62A7.94 7.94 0 0 1 12.5 11c3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></button>
      <button class="tb" id="tbRedo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M18.4 10.6A9.95 9.95 0 0 0 11.5 8c-4.65 0-8.58 3.03-9.97 7.22L3.9 16c1.05-3.19 4.06-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg></button>
      <button class="tb" id="tbPrint" title="Print / PDF"><svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM18 3H6v4h12V3z"/></svg></button>
    </div>

    <div class="tb-sep"></div>

    <!-- zoom -->
    <div class="tb-group">
      <button class="tb" id="zoomOut" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14z"/></svg></button>
      <button class="tb zoom-label" id="zoomLabel" title="Fit to width">100%</button>
      <button class="tb" id="zoomIn" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>
      <button class="tb" id="fitWidth" title="Fit page to width"><svg viewBox="0 0 24 24"><path d="M4 6h2v12H4zM18 6h2v12h-2zM7 12l3-3v2h4V9l3 3-3 3v-2H10v2z"/></svg></button>
    </div>

    <div class="tb-sep"></div>

    <!-- paragraph style -->
    <div class="tb-group">
      <select class="tb-select" id="styleSelect" title="Paragraph style">
        <option value="p">Normal text</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
        <option value="blockquote">Quote</option>
        <option value="pre">Code block</option>
      </select>
      <select class="tb-select" id="fontSelect" title="Font family">
        <option value="Roboto, Arial, sans-serif">Roboto</option>
        <option value="Arial, Helvetica, sans-serif">Arial</option>
        <option value="Georgia, 'Times New Roman', serif">Georgia</option>
        <option value="'Times New Roman', Times, serif">Times New Roman</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="Verdana, Geneva, sans-serif">Verdana</option>
      </select>
      <button class="tb" id="sizeDec" title="Decrease font size">A-</button>
      <select class="tb-select size-select" id="sizeSelect" title="Font size">
        <option>8</option><option>9</option><option>10</option><option selected>11</option>
        <option>12</option><option>14</option><option>18</option><option>24</option>
        <option>30</option><option>36</option><option>48</option><option>60</option><option>72</option>
      </select>
      <button class="tb" id="sizeInc" title="Increase font size">A+</button>
    </div>

    <div class="tb-sep"></div>

    <!-- inline formatting -->
    <div class="tb-group">
      <button class="tb fmt" id="tbBold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="tb fmt" id="tbItalic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="tb fmt" id="tbUnderline" title="Underline (Ctrl+U)"><u>U</u></button>
      <button class="tb fmt" id="tbStrike" title="Strikethrough"><s>S</s></button>
      <button class="tb" id="tbTextColor" title="Text color"><span class="color-a">A</span><span class="color-bar" id="textColorBar"></span></button>
      <button class="tb" id="tbHighlight" title="Highlight color"><span class="hl-ico">A</span><span class="color-bar" id="hlColorBar"></span></button>
      <button class="tb" id="tbClearFmt" title="Clear formatting"><svg viewBox="0 0 24 24"><path d="M3.27 5 2 6.27l6.97 6.97L6.5 19h3l1.57-3.66L16.73 21 18 19.73 3.55 5.27 3.27 5zM6 5v.18L8.82 8h2.4l-.72 1.68 2.1 2.1L14.21 8H20V5H6z"/></svg></button>
    </div>

    <div class="tb-sep"></div>

    <!-- alignment / lists -->
    <div class="tb-group">
      <button class="tb" id="tbAlignLeft" title="Align left"><svg viewBox="0 0 24 24"><path d="M15 15H3v2h12v-2zm0-8H3v2h12V7zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z"/></svg></button>
      <button class="tb" id="tbAlignCenter" title="Align center"><svg viewBox="0 0 24 24"><path d="M7 15v2h10v-2H7zm-4 6h18v-2H3v2zm0-8h18v-2H3v2zm4-6v2h10V7H7zM3 3v2h18V3H3z"/></svg></button>
      <button class="tb" id="tbAlignRight" title="Align right"><svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm6-4h12v-2H9v2zm-6-4h18v-2H3v2zm6-4h12V7H9v2zM3 3v2h18V3H3z"/></svg></button>
      <button class="tb" id="tbAlignJustify" title="Justify"><svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm0-4h18v-2H3v2zm0-4h18v-2H3v2zm0-4h18V7H3v2zm0-6v2h18V3H3z"/></svg></button>
      <button class="tb" id="tbBullets" title="Bulleted list"><svg viewBox="0 0 24 24"><path d="M4 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0-6a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0 12a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM8 19h13v-2H8v2zm0-6h13v-2H8v2zm0-8v2h13V5H8z"/></svg></button>
      <button class="tb" id="tbNumbers" title="Numbered list"><svg viewBox="0 0 24 24"><path d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/></svg></button>
      <button class="tb" id="tbOutdent" title="Decrease indent"><svg viewBox="0 0 24 24"><path d="M11 17h10v-2H11v2zm-8-5l4 4V8l-4 4zm0 9h18v-2H3v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z"/></svg></button>
      <button class="tb" id="tbIndent" title="Increase indent"><svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2zm0 6h10v-2H11v2zM3 13l4-4-4-4v8z"/></svg></button>
    </div>

    <div class="tb-sep"></div>

    <!-- insert / line spacing -->
    <div class="tb-group">
      <button class="tb" id="tbHr" title="Insert horizontal line"><svg viewBox="0 0 24 24"><path d="M4 11h16v2H4z"/></svg></button>
      <button class="tb" id="tbLink" title="Insert link (Ctrl+K)"><svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4a5 5 0 0 0 0-10z"/></svg></button>
      <button class="tb" id="tbTable" title="Insert table"><svg viewBox="0 0 24 24"><path d="M20 3H4v18h16V3zm-9 8V5h7v6h-7zm-5-6h3v6H6V5zm0 8h3v8H6v-8zm5 8v-8h7v8h-7z"/></svg></button>
      <select class="tb-select" id="lineSpacing" title="Line spacing">
        <option value="1">1.0</option>
        <option value="1.15" selected>1.15</option>
        <option value="1.5">1.5</option>
        <option value="2">2.0</option>
      </select>
    </div>

  </div>
</div>

<!-- ======================= RULER ======================= -->
<div id="rulerWrap">
  <div id="ruler">
    <canvas id="rulerCanvas" height="26"></canvas>
    <div class="ruler-margin left" style="left:0;width:96px"></div>
    <div class="ruler-margin right" style="right:0;width:96px"></div>
  </div>
</div>

<!-- ======================= CANVAS ======================= -->
<main id="canvas">
  <div id="scaler">
    <div id="stack">
      <!-- page backgrounds injected by JS -->
      <div id="pages"></div>
      <!-- editable content -->
      <div id="content" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="sentences"></div>
    </div>
  </div>
</main>

<!-- ======================= STATUS BAR ======================= -->
<footer id="statusbar">
  <span id="pageInfo">Page 1 of 1</span>
  <span class="dot">·</span>
  <span id="wordInfo">0 words</span>
  <span class="dot">·</span>
  <span id="charInfo">0 characters</span>
  <span class="spacer"></span>
  <span id="zoomInfo">100%</span>
</footer>

<!-- ======================= FLOATING ACTION BUTTON ======================= -->
<button id="fab" title="New document" aria-label="New document">
  <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
</button>

<!-- ======================= MENUS ======================= -->
<div id="menuPop" class="pop hidden"></div>
<div id="colorPop" class="pop hidden"></div>
<div id="exportPop" class="pop hidden"></div>
<div id="findBar" class="hidden">
  <input id="findInput" placeholder="Find in document" spellcheck="false">
  <span id="findCount">0/0</span>
  <button class="icon-btn sm" id="findPrev" title="Previous">&#9650;</button>
  <button class="icon-btn sm" id="findNext" title="Next">&#9660;</button>
  <button class="icon-btn sm" id="findClose" title="Close">&#10005;</button>
</div>
<div id="snack" class="hidden"></div>

<script src="editor.js"></script>
</body>
</html>
